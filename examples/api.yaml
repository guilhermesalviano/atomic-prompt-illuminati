# Example api configuration. Copy to ./api.yaml or ~/.config/api/config.yaml.
repo: .

models:
  planner:
    agent: claude
    model: opus
  executor:
    agent: codex
    model: gpt-6-sol
    sandbox: workspace-write   # read-only | workspace-write | danger-full-access
    approve_for_me: true
    # bypass: true             # skip codex approvals entirely (only in sandboxes)
  reviewer:
    agent: opencode
    model: opencode-go/deepseek-v4.1-flash
    variant: high
    subagent: plan             # read-only opencode agent

loop:
  max_iterations: 2

gates:
  after_plan: true
  after_review: true

timeouts:
  planner: 15m
  executor: 45m
  reviewer: 15m

planner_budget_usd: 5
apply: false
open_pr: false
